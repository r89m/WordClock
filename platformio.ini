; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
monitor_filters = time ;, colorize, log2file, esp8266_exception_decoder
upload_speed = 921600
lib_deps =  adafruit/Adafruit MPR121@^1.2.1
            r89m/MPR121Button@^1.0.0
            esp32async/ESPAsyncTCP@^2.0.0
            esp32async/ESPAsyncWebServer@^3.9.4
            sstaub/NTP@^1.6
            https://github.com/adafruit/HT1632.git
build_flags =
    -D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -D WIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"