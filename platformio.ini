; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
monitor_filters = time ;, colorize, log2file, esp8266_exception_decoder
upload_speed = 921600
lib_deps =  jchristensen/DS3232RTC@^3.1.2
            jchristensen/Timezone@^1.2.6
            paulstoffregen/TimeAlarms
            adafruit/Adafruit MPR121@^1.2.1
            r89m/MPR121Button@^1.0.0
            r89m/r89m PushButton@^1.0.1
            thomasfredericks/Bounce2@^2.72
            robtillaart/RunningAverage@^0.4.8
            https://github.com/adafruit/HT1632.git